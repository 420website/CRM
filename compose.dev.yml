services:
  ###### Storage ####
  postgres-dev:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./certs:/certs:ro
    environment:
      - POSTGRES_INITDB_ARGS="--auth-host=md5"
      - POSTGRES_HOST_AUTH_METHOD=md5
    env_file: 
      - .env
    networks:
      - backend-net
      - db-net
    profiles:
      - dev
      - dev_backend 
      - dev_frontend 
      - db
    command: |
      postgres 
        -c ssl=on 
        -c ssl_cert_file=/certs/server.crt 
        -c ssl_key_file=/certs/server.key 
        -c ssl_ca_file=/certs/ca.crt 
        -c ssl_min_protocol_version=TLSv1.2
        -c app.legacy_instance=${IS_MY420:-false}

  dbmate-dev:
    image: amacneil/dbmate
    depends_on:
      - postgres-dev
    env_file:
      - .env
    volumes:
      - ./db/migrations:/db/migrations
    networks:
      - db-net
    profiles:
      - dev
      - dev_backend 
      - dev_frontend 
      - db
    command: ["--wait","up"]

  redis-dev:
    image: redis:7
    restart: unless-stopped
    volumes: 
      - redis_data_dev:/data
    env_file:
      - .env
    networks: 
      - backend-net
    command: sh -c 'redis-server --requirepass $$REDIS_PASSWORD'

  minio-dev:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"   # API & SDK access
      - "9001:9001"   # Web console
    env_file: 
      - .env
    volumes:
      - minio_data_dev:/data
      - ./certs/server.crt:/root/.minio/certs/public.crt 
      - ./certs/server.key:/root/.minio/certs/private.key 
    networks:
      - backend-net
      - db-net
    profiles:
      - dev
      - dev_backend
      - dev_frontend
      - db
      - minio
    command: server /data --console-address ":9001" --address ":9000"

  minio-init-dev:
    image: minio/mc:latest
    depends_on:
      - minio-dev
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mkdir -p /root/.mc/certs/CAs &&
      cp /certs/ca.crt /root/.mc/certs/CAs/ &&
      mc alias set local https://minio-dev:9000 testuser password --api S3v4 
      "
    volumes:
      - ./certs/ca.crt:/certs/ca.crt
    networks:
      - backend-net
      - db-net
    profiles:
      - minio

  mongodb-dev:
    # image: mongodb/mongodb-community-server:latest
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    profiles:
      - dev 
      - backend 
    env_file:
      - .env
    networks:
      - backend-net

  ####### Reverse Proxy #######
  caddy-dev:
    image: caddy:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dev.caddy:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend-net
      - frontend-net
  #
  # nginx-dev:
  #   image: nginx:stable-alpine
  #   ports:
  #     - 80:80
  #     - 443:443
  #   depends_on:
  #     - backend-dev
  #   volumes:
  #     - ./certs:/certs:ro
  #     - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
  #   networks:
  #     - backend-net
  #     - frontend-net
  #   profiles:
  #     - dev 
  #     - backend
  #     - nginx

  ####### Application ########
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev 
    env_file:
      - .env
    networks:
      - backend-net 
      - frontend-net
    profiles:
      - dev
      - dev_backend 
    ports:
      - 8000:8000
    volumes:
      - ./scripts/wait-for-db.sh:/scripts/wait-for-db.sh
      - ./scripts/create_admin.sh:/scripts/create_admin.sh
      - ./backend/app:/backend/app
      - ./backend/scripts:/backend/scripts 
      - ./certs:/certs:ro
      - logs_dev:/logs  
    entrypoint: ["/scripts/create_admin.sh"]
    command: 'python -m app.main'

  ####### UI #########
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev 
    env_file:
      - .env
    networks:
      - frontend-net
    profiles:
      - dev 
      - frontend
    volumes:
      - ./frontend:/frontend
      - node_modules_dev:/frontend/node_modules
    command: > 
      sh -c " 
        npm install;
        npm run dev -- --host 0.0.0.0 --port 5173
      "

volumes:
  node_modules_dev:
  postgres_data_dev:
  redis_data_dev:
  mongo_data_dev:
  minio_data_dev:
  caddy_data:
  caddy_config:

  logs_dev:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./logs

networks:
  frontend-net:
    driver: bridge
 
  db-net:
    driver: bridge

  backend-net:
    driver: bridge



