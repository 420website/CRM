services:
  vault-agent:
    image: hashicorp/vault
    restart: unless-stopped
    command: agent -config=/vault/config/agent-config.hcl
    env_file:
      - /etc/vault/.env
    volumes:
      - ./vault/agent-config.hcl:/vault/config/agent-config.hcl:ro
      - /etc/vault:/etc/vault
      - ./vault/templates:/etc/vault/templates
    cap_add:
      - IPC_LOCK
    profiles:
      - vault-agent
      - prod
    # mem_reservation: 110m
    # mem_limit: 145m
    # memswap_limit: 145m

  setup-watcher:
    image: alpine:latest
    volumes:
      - ./scripts/secret-reload.sh:/tmp/secret-reload.sh:ro
      - ./scripts/cert-reload.sh:/tmp/cert-reload.sh:ro
      - ./scripts/setup-watcher.sh:/setup.sh:ro
      - /:/host 
    command: sh /setup.sh
    privileged: true
    network_mode: host
    profiles:
      - setup
      - prod

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    env_file:
      - /etc/vault/secrets/.env
    extra_hosts:
      - "loki.internal:139.177.195.180"
      - "prometheus.internal:139.177.195.180"
    volumes:
      - /etc/vault/certs:/certs:ro
      - postgres_data:/var/lib/postgresql/data:ro
      - backend-logs:/backend/logs:ro
      - ./grafana/config.alloy:/etc/alloy/config.alloy:ro
    command: run /etc/alloy/config.alloy
    profiles:
      - dev
      - prod
      - cert-reload
      - secret-reload
    depends_on:
      - postgres
    mem_reservation: 220m
    mem_limit: 290m
    memswap_limit: 290m

  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/vault/certs:/certs
      - ./scripts/postgres-start.sh:/postgres-start.sh:ro
    env_file:
      - /etc/vault/secrets/.env
    environment:
      - POSTGRES_INITDB_ARGS="--auth-host=md5"
      - POSTGRES_HOST_AUTH_METHOD=md5
    networks:
      - backend-net
      - db-net
    profiles:
      - dev
      - prod
      - cert-reload
      - secret-reload
    entrypoint: ["/postgres-start.sh"]
    mem_reservation: 120m
    mem_limit: 150m
    memswap_limit: 150m

  dbmate:
    image: amacneil/dbmate
    volumes:
      - ./db/migrations:/db/migrations
      - /etc/vault/certs:/certs:ro
    depends_on:
      - postgres
    environment:
    - DATABASE_URL=${POSTGRES_URL}
    env_file:
      - /etc/vault/secrets/.env
    networks:
      - db-net
    profiles:
      - dev
      - prod
      - cert-reload
      - secret-reload
    command: ["--wait","up"]

  redis:
    image: redis:7
    restart: unless-stopped
    volumes: 
      - redis_data:/data
    networks:
      - backend-net
    env_file:
      - /etc/vault/secrets/.env
    profiles:
      - dev
      - prod
      - cert-reload
      - secret-reload
    command: sh -c 'redis-server --requirepass $$REDIS_PASSWORD'
    mem_reservation: 50m
    mem_limit: 75m
    memswap_limit: 75m

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file:
      - /etc/vault/secrets/.env
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
      - /etc/vault/certs/server.crt:/root/.minio/certs/public.crt
      - /etc/vault/certs/server.key:/root/.minio/certs/private.key
      - /etc/vault/certs/ca-chain.crt:/root/.minio/certs/CAs/ca-chain.crt
    networks:
      - backend-net
      - db-net
    profiles:
      - dev
      - prod
      - cert-reload
      - secret-reload
    command: server /data --console-address ":9001" --address ":9000"
    mem_reservation: 165m
    mem_limit: 220m
    memswap_limit: 220m

  minio_init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mkdir -p /root/.mc/certs/CAs &&
      cp /certs/ca-chain.crt /root/.mc/certs/CAs/ &&
      mc alias set local https://minio:9000 testuser password --api S3v4 &&
      mc mb local/attachments &&
      mc mb local/photos
      "
    volumes:
      - /etc/vault/certs/ca-chain.crt:/certs/ca-chain.crt
    networks:
      - backend-net
      - db-net
    profiles:
      - dev
      - prod
      - cert-reload
      - secret-reload

  mongodb:
    image: mongodb/mongodb-community-server:latest
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - /etc/vault/certs:/certs:ro
    env_file:
      - /etc/vault/secrets/.env
    networks:
      - backend-net
    profiles:
      - dev
      - prod
      - cert-reload
      - secret-reload
    mem_reservation: 210m
    mem_limit: 280m
    memswap_limit: 280m

  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./scripts/wait-for-db.sh:/scripts/wait-for-db.sh
      - ./scripts/create_admin.sh:/scripts/create_admin.sh
      - /etc/vault/certs:/certs:ro
      - backend-logs:/logs
    env_file:
      - /etc/vault/secrets/.env
    depends_on:
      - mongodb
      - postgres
      - minio
      - minio_init
    networks:
      - backend-net
      - frontend-net
    profiles:
      - dev
      - prod
      - cert-reload
      - secret-reload
    entrypoint: ["/scripts/create_admin.sh"]
    command: 'python -m app.main'
    mem_reservation: 400m
    mem_limit: 500m
    memswap_limit: 500m

  frontend-builder:
    build: ./frontend
    volumes:
      - frontend_dist:/dist
    env_file:
      - /etc/vault/secrets/.env
    profiles:
      - dev
      - prod
      - cert-reload
      - secret-reload
    command: >
      sh -c "
        npm run build &&
        cp -r dist/. /dist
      "

  nginx-dev:
    image: nginx:stable-alpine
    ports:
      - 8000:80
    profiles:
      - dev
    networks:
      - frontend-net
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro


  nginx-setup:
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.setup.conf:/etc/nginx/templates/nginx.conf.template
      - /etc/vault/certs:/certs:ro
    env_file:
      - /etc/vault/secrets/.env
    profiles:
      - staging

  certbot-setup:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - ./scripts/cert_check.sh:/scripts/cert_check.sh:ro
      - /etc/vault/certs:/certs:ro
    env_file:
      - /etc/vault/secrets/.env
    depends_on:
      - nginx-setup
    profiles:
      - staging
    entrypoint: ["sh"]
    command: ["/scripts/cert_check.sh"]

  nginx-prod:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/templates/nginx.conf.template
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/vault/certs:/certs:ro
    env_file:
      - /etc/vault/secrets/.env
    profiles:
      - prod
      - cert-reload
      - secret-reload
    networks:
      - frontend-net
    depends_on:
      - backend
    mem_reservation: 50m
    mem_limit: 80m
    memswap_limit: 80m

volumes:
  frontend_dist:
  mongo_data:
  postgres_data:
  minio_data:
  redis_data:
  certbot-etc:
  certbot-var:
  certbot-www:

  backend-logs:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /opt/app/logs

networks:
  frontend-net:
    driver: bridge

  backend-net:
    driver: bridge

  db-net:
    driver: bridge


