name: Deploy to Production   

on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed
    branches:
      - main


jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_IP  }}
          username: ${{ secrets.PRODUCTION_USERNAME  }}
          key: ${{ secrets.PRODUCTION_KEY_PRIVATE  }}
          port: ${{  secrets.PRODUCTION_PORT  }}
          script: |
            whoami 

            REPO_DIR="$HOME/crm"
            REPO_URL="git@github.com:420website/crm.git"

            # Clone the repo if it doesn't exist
            if [ ! -d "$REPO_DIR/.git" ]; then
                echo "Repo not found, cloning..."
                git clone "$REPO_URL" "$REPO_DIR"
                cd "$REPO_DIR"
            else
                echo "Repo found, pulling latest changes..."
                cd "$REPO_DIR"
                git pull origin main 
            fi

            # Import application/ TLS envrionment varibles
            cat > .env << 'EOF'
            # Backend 
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_SERVER=${{ secrets.SMTP_SERVER }}
            SMTP_EMAIL=${{ secrets.SMTP_EMAIL }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM }}
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            MFA_ENCRYPTION_KEY=${{ secrets.MFA_ENCRYPTION_KEY }}
            APP_NAME=${{ secrets.APP_NAME }}
            APP_URL=${{ secrets.APP_URL }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            SUPPORT_EMAIL=${{ secrets.SUPPORT_EMAIL }} 

            # Frontend 
            VITE_API_BACKEND_URL=${{ secrets.VITE_API_BACKEND_URL }}
            VITE_APP_GOOGLE_PLACES_API_KEY=${{ secrets.VITE_APP_GOOGLE_PLACES_API_KEY }}

            # Database 
            MONGO_URL=${{ secrets.MONGO_URL }}
            MONGODB_INITDB_ROOT_USERNAME=${{ secrets.MONGODB_INITDB_ROOT_USERNAME }} 
            MONGODB_INITDB_ROOT_PASSWORD=${{ secrets.MONGODB_INITDB_ROOT_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }} 
            DB_PORT=${{ secrets.DB_PORT }}

            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}

            # Nginx
            DOMAIN_ROOT=${{ secrets.DOMAIN_ROOT }}
            DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
            SSL_CERT=${{ secrets.SSL_CERT }}
            SSL_CERT_KEY=${{secrets.SSL_CERT_KEY }}
            CERTBOT_EMAIL=${{ secrets.CERTBOT_EMAIL }}
            CERTBOT_CONTAINER=${{ secrets.CERTBOT_CONTAINER }}
            CERTBOT_VOLUME=${{ secrets.CERTBOT_VOLUME }}

            # Admin 
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            ADMIN_PHONE=${{ secrets.ADMIN_PHONE }}

            EOF

            # Make deploy script executable and run it
            chmod +x ./scripts/deploy.sh 
            ./scripts/deploy.sh
