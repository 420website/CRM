services:
  vault-agent:
    image: hashicorp/vault
    command: agent -config=/vault/config/agent-config.hcl
    env_file:
      - /etc/vault/.env
    volumes:
      - ./vault/agent-config.hcl:/vault/config/agent-config.hcl:ro
      - /etc/vault:/etc/vault
      - ./vault/templates:/etc/vault/templates
    cap_add:
      - IPC_LOCK
    profiles:
      - vault-agent
      - prod

  alloy:
    image: grafana/alloy:latest
    env_file: 
      - /etc/vault/secrets/.env
    extra_hosts:
      - "loki.internal:${GRAFANA_IP}"
      - "prometheus.internal:${GRAFANA_IP}"
    volumes:
      - ./grafana/config.alloy:/etc/alloy/config.alloy:ro
      - postgres_data:/var/lib/postgresql/data:ro
      - /etc/vault/certs:/certs:ro
    command: run /etc/alloy/config.alloy
    profiles:
      - dev 
      - prod
    depends_on:
      - postgres
  
  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/vault/certs:/certs
      - ./scripts/postgres-start.sh:/postgres-start.sh:ro
    env_file: 
      - /etc/vault/secrets/.env
    environment:
      - POSTGRES_INITDB_ARGS="--auth-host=md5"
      - POSTGRES_HOST_AUTH_METHOD=md5
    networks:
      - backend-net
      - db-net
    profiles:
      - dev 
      - prod
    entrypoint: ["/postgres-start.sh"]

  dbmate:
    image: amacneil/dbmate
    volumes:
      - ./db/migrations:/db/migrations
      - /etc/vault/certs:/certs:ro
    depends_on:
      - postgres
    env_file: 
      - /etc/vault/secrets/.env
    networks:
      - db-net
    profiles:
      - dev 
      - prod
    command: ["--wait","up"]

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API & SDK access
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: testuser
      MINIO_ROOT_PASSWORD: password
      MINIO_SERVER_URL: https://minio:9000
    volumes:
      - minio_data:/data
      - ./certs/server.crt:/root/.minio/certs/public.crt 
      - ./certs/server.key:/root/.minio/certs/private.key 
    networks:
      - backend-net
      - db-net
    profiles:
      - dev
      - dev_backend
      - dev_frontend
      - db
      - minio
    command: server /data --console-address ":9001" --address ":9000"

  minio_init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mkdir -p /root/.mc/certs/CAs &&
      cp /certs/ca.crt /root/.mc/certs/CAs/ &&
      mc alias set local https://minio:9000 testuser password --api S3v4 &&
      mc mb local/attachments &&
      mc mb local/photos
      "
    volumes:
      - ./certs/ca.crt:/certs/ca.crt
    networks:
      - backend-net
      - db-net
    profiles:
      - minio

  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - /etc/vault/certs:/certs:ro
    env_file: 
      - /etc/vault/secrets/.env
    networks:
      - backend-net
    profiles:
      - dev 
      - prod 

  backend: 
    build: ./backend
    volumes:
      - ./scripts/wait-for-db.sh:/scripts/wait-for-db.sh
      - ./scripts/create_admin.sh:/scripts/create_admin.sh
      - /etc/vault/certs:/certs:ro
    env_file: 
      - /etc/vault/secrets/.env
    depends_on:
      - mongodb
      - postgres
    networks:
      - backend-net 
      - frontend-net
    profiles:
      - dev 
      - prod
    entrypoint: ["/scripts/create_admin.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "5000"]

  frontend-builder:
    build: ./frontend
    volumes:
      - frontend_dist:/dist
    env_file: 
      - /etc/vault/secrets/.env
    profiles:
      - dev 
      - prod
    command: >
      sh -c "
        npm run build &&
        cp -r dist/. /dist
      "

  nginx-dev:
    image: nginx:stable-alpine
    ports:
      - 8000:80
    profiles:
      - dev
    networks:
      - frontend-net
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

  nginx-setup:
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.setup.conf:/etc/nginx/templates/nginx.conf.template
      - /etc/vault/certs:/certs:ro
    env_file: 
      - /etc/vault/secrets/.env
    profiles:
      - staging

  certbot-setup:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - ./scripts/cert_check.sh:/scripts/cert_check.sh:ro
      - /etc/vault/certs:/certs:ro
    env_file: 
      - /etc/vault/secrets/.env
    depends_on: 
      - nginx-setup
    profiles:
      - staging
    entrypoint: ["sh"]
    command: ["/scripts/cert_check.sh"]

  nginx-prod:
    image: nginx:alpine 
    ports:
      - 80:80
      - 443:443
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/templates/nginx.conf.template
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf       
      - /etc/vault/certs:/certs:ro
    env_file: 
      - /etc/vault/secrets/.env
    profiles:
      - prod
    networks:
      - frontend-net
    depends_on:
      - backend

volumes: 
  mongo_data:
  postgres_data:
  alloy-data:
  frontend_dist:
  certbot-etc:
  certbot-var:
  certbot-www:

networks:
  frontend-net:
    driver: bridge
 
  backend-net:
    driver: bridge

  db-net:
    driver: bridge


