services:
  vault-agent:
    image: hashicorp/vault
    command: agent -config=/vault/config/agent-config.hcl
    env_file:
      - /etc/vault/.env
    volumes:
      - ./vault/agent-config.hcl:/vault/config/agent-config.hcl:ro
      - /etc/vault:/etc/vault
      - ./vault/templates:/etc/vault/templates
    cap_add:
      - IPC_LOCK
    profiles:
      - vault-agent
      - prod
  
  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/vault/certs:/certs:ro
    env_file: 
      - /etc/vault/secrets/.env
    environment:
      - POSTGRES_INITDB_ARGS="--auth-host=md5"
      - POSTGRES_HOST_AUTH_METHOD=md5
    networks:
      - backend-net
      - db-net
    profiles:
      - dev 
      - prod
    command: |
      postgres 
        -c ssl=on 
        -c ssl_cert_file=/certs/server.crt 
        -c ssl_key_file=/certs/server.key 
        -c ssl_ca_file=/certs/ca-chain.crt 
        -c ssl_min_protocol_version=TLSv1.2

  dbmate:
    image: amacneil/dbmate
    volumes:
      - ./db/migrations:/db/migrations
      - /etc/vault/certs:/certs:ro
    depends_on:
      - postgres
    env_file: 
      - /etc/vault/secrets/.env
    networks:
      - db-net
    profiles:
      - dev 
      - prod
    command: ["--wait","up"]

  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - /etc/vault/certs:/certs:ro
    env_file: 
      - /etc/vault/secrets/.env
    networks:
      - backend-net
    profiles:
      - dev 
      - prod 

  backend: 
    build: ./backend
    volumes:
      - ./scripts/wait-for-db.sh:/scripts/wait-for-db.sh
      - ./scripts/create_admin.sh:/scripts/create_admin.sh
      - /etc/vault/certs:/certs:ro
    env_file: 
      - /etc/vault/secrets/.env
    depends_on:
      - mongodb
      - postgres
    networks:
      - backend-net 
      - frontend-net
    profiles:
      - dev 
      - prod
    entrypoint: ["/scripts/create_admin.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "5000"]

  frontend-builder:
    build: ./frontend
    volumes:
      - frontend_dist:/dist
    env_file: 
      - /etc/vault/secrets/.env
    profiles:
      - dev 
      - prod
    command: >
      sh -c "
        npm run build &&
        cp -r dist/. /dist
      "

  nginx-dev:
    image: nginx:stable-alpine
    ports:
      - 8000:80
    profiles:
      - dev
    networks:
      - frontend-net
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

  nginx-setup:
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.setup.conf:/etc/nginx/templates/nginx.conf.template
      - /etc/vault/certs:/certs:ro
    env_file: 
      - /etc/vault/secrets/.env
    profiles:
      - staging

  certbot-setup:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - ./scripts/cert_check.sh:/scripts/cert_check.sh:ro
      - /etc/vault/certs:/certs:ro
    env_file: 
      - /etc/vault/secrets/.env
    depends_on: 
      - nginx-setup
    profiles:
      - staging
    entrypoint: ["sh"]
    command: ["/scripts/cert_check.sh"]

  nginx-prod:
    image: nginx:alpine 
    ports:
      - 80:80
      - 443:443
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/templates/nginx.conf.template
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf       
      - /etc/vault/certs:/certs:ro
    env_file: 
      - /etc/vault/secrets/.env
    profiles:
      - prod
    networks:
      - frontend-net
    depends_on:
      - backend

volumes: 
  frontend_dist:
  mongo_data:
  postgres_data:
  certbot-etc:
  certbot-var:
  certbot-www:

networks:
  frontend-net:
    driver: bridge
 
  backend-net:
    driver: bridge

  db-net:
    driver: bridge


